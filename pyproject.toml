[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-animation-harness"
version = "0.2.0"
description = "A provider-agnostic CLI and JSON protocol for validating and preparing sprite animations."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0,<13",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "jsonschema>=4.21,<5"]

[project.scripts]
sprite-harness = "sprite_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
