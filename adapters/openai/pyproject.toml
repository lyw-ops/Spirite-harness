[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sprite-openai-adapter"
version = "0.1.0"
description = "Optional external OpenAI Images edit adapter for Sprite Harness generation v1"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13"]

[project.scripts]
sprite-openai-adapter = "sprite_openai_adapter:main"

[tool.setuptools.packages.find]
where = ["src"]
